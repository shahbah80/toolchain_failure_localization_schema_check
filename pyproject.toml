[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shahbah80-toolchain_failure_localization_schema_check"
version = "0.1.0"
description = "从样本里推断训练资源调度工程师·多轮工具链的失败定位应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "shahbah80" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://shahbah80.github.io"
Repository = "https://github.com/shahbah80/toolchain_failure_localization_schema_check"
Issues = "https://github.com/shahbah80/toolchain_failure_localization_schema_check/issues"

[project.scripts]
toolchain_failure_localization_schema_check = "toolchain_failure_localization_schema_check:main"

[tool.setuptools]
py-modules = ["toolchain_failure_localization_schema_check"]
